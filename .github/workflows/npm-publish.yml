# Build and publish the package to npm via Trusted Publishing (OIDC).
#
# Trigger: manual only (workflow_dispatch) — run from the repository's Actions tab.
#
# One-time setup on npm (package → Settings → Trusted Publishing → GitHub Actions):
#   Organization or user: huaweicloud-mate
#   Repository:            hdcommunity-toolkit
#   Workflow filename:     npm-publish.yml   (filename only, exact, case-sensitive)
#   Environment:           (leave empty)
# Docs: https://docs.npmjs.com/trusted-publishers

name: Node.js Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run smoke

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing (+ automatic provenance)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Diagnostics
        run: |
          echo "npm: $(npm --version)"
          echo "registry: $(npm config get registry)"
          echo "NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:+present}${NODE_AUTH_TOKEN:-absent}"
          echo "ID_TOKEN_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:+present}${ACTIONS_ID_TOKEN_REQUEST_URL:-absent}"
      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish