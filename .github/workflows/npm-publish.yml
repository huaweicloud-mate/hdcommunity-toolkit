# Build and publish the package to npm via Trusted Publishing (OIDC).
#
# No long-lived token / secret is used. npm is deprecating 2FA-bypass tokens for
# direct publishing (see: github.blog/changelog/2026-07-08-...-gat-bypass2fa-deprecation);
# trusted publishing is the recommended replacement.
#
# Trigger: manual only (workflow_dispatch) — run from the repository's Actions tab.
#
# One-time setup on npm (package → Settings → Trusted Publishing → GitHub Actions):
#   Organization or user: huaweicloud-mate
#   Repository:            hdcommunity-toolkit
#   Workflow filename:     npm-publish.yml
#   Environment:           (leave empty)
# Docs: https://docs.npmjs.com/trusted-publishers

name: Node.js Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run smoke

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing (+ provenance)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      # Trusted publishing requires npm >= 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish